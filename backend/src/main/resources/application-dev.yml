server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/railwaydb}
    username: ${DB_USERNAME:SA}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: railway-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-in-production}

app:
  kafka:
    enabled: ${APP_KAFKA_ENABLED:true}
    topic: ${APP_KAFKA_TOPIC:complaint-classification}
  ai:
    enabled: ${APP_AI_ENABLED:true}
    classifier-url: ${APP_AI_CLASSIFIER_URL:https://midhun-2542-railwaymodel.hf.space/classify}
  internal:
    api-key: ${APP_INTERNAL_API_KEY:dev-internal-key}
  officer-signup-key: ${APP_OFFICER_SIGNUP_KEY:dev-officer-key}

logging:
  level:
    org.springframework: INFO
    com.railway.backend: DEBUG
